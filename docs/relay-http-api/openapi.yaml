openapi: 3.1.1

info:
  title: Blitz Relay HTTP API
  description: |
    RESTful API for administrative room management in Blitz Relay.
    Most endpoints require a Bearer token matching `BLITZ_RELAY_HTTP_ADMIN_TOKEN`.
    `DELETE /rooms/{roomCode}`, `PATCH /rooms/{roomCode}`, and
    `DELETE /rooms/{roomCode}/clients/{virtualClientId}` also accept the room's host token.
  version: 1.0.0

servers:
  - url: http://localhost:7771
    description: Default local development server

paths:
  /health:
    get:
      summary: Health check
      description: Returns a simple OK response. No authentication required.
      security: [ ]
      responses:
        '200':
          description: Server is healthy

  /version:
    get:
      summary: Get the relay's version
      description: Returns the version of the running relay.
      responses:
        '200':
          description: The relay's version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms:
    post:
      summary: Create a persistent room
      description: Creates a new persistent reserved room with the specified configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '200':
          description: Room created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSnapshot'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      summary: List all rooms
      description: Returns a list of all current rooms.
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{roomCode}:
    parameters:
      - name: roomCode
        in: path
        required: true
        schema:
          type: string
        description: The 8-character room code

    get:
      summary: Get room details
      description: Returns the snapshot of a specific room.
      responses:
        '200':
          description: Room found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

    delete:
      summary: Delete a room
      description: Deletes a room and disconnects all participants. Accepts admin token or room host token.
      responses:
        '204':
          description: Room deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

    patch:
      summary: Update a room
      description: |
        Updates a room's display name and/or metadata.
        Metadata keys in `metadataToAdd` are added or overwritten.
        Metadata keys in `metadataToRemove` are deleted.
        Accepts admin token or room host token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRoomRequest'
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSnapshot'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

  /rooms/{roomCode}/clients:
    parameters:
      - name: roomCode
        in: path
        required: true
        schema:
          type: string
        description: The 8-character room code

    get:
      summary: List a room's clients
      description: |
        Returns the clients connected to a room. Requires the admin token.
        The relay's `--client-details` option (or the `BLITZ_RELAY_CLIENT_DETAILS` environment variable) sets the
        fields of each client: `Ids` (the default) returns `ClientSnapshot`, `IpAddresses` returns
        `ClientIpAddressSnapshot`, and `IpEndpoints` returns `ClientIpEndpointSnapshot`.
      responses:
        '200':
          description: Room found
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/ClientSnapshot'
                    - $ref: '#/components/schemas/ClientIpAddressSnapshot'
                    - $ref: '#/components/schemas/ClientIpEndpointSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

  /rooms/{roomCode}/clients/{virtualClientId}:
    parameters:
      - name: roomCode
        in: path
        required: true
        schema:
          type: string
        description: The 8-character room code
      - name: virtualClientId
        in: path
        required: true
        schema:
          type: integer
        description: The virtual client ID of the participant to kick

    delete:
      summary: Kick a client from a room
      description: |
        Removes a client from the room and disconnects them.
        Accepts admin token or room host token.
      responses:
        '204':
          description: Client kicked successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room or client not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token matching `BLITZ_RELAY_HTTP_ADMIN_TOKEN` for most endpoints,
        or the room's host token for room-specific management endpoints.

  responses:
    Unauthorized:
      description: Missing or invalid authentication token

  schemas:
    VersionResponse:
      type: object
      properties:
        version:
          type: string
          description: The relay's version, for example `1.4.0`
      required:
        - version

    CreateRoomRequest:
      type: object
      properties:
        maximumClients:
          type: integer
          minimum: 1
          maximum: 65535
          default: 4096
          description: Maximum number of clients allowed in the room
        displayName:
          type: string
          maxLength: 255
          default: ""
          description: Display name for the room (max 255 bytes UTF-8)
        isPublic:
          type: boolean
          default: false
          description: Whether the room is publicly discoverable
        metadata:
          type: [ object, 'null' ]
          additionalProperties:
            type: string
          description: Optional key-value metadata for the room

    PatchRoomRequest:
      type: object
      properties:
        displayName:
          type: [ string, 'null' ]
          description: New display name for the room (max 255 bytes UTF-8). Null to leave unchanged.
        metadataToAdd:
          type: [ object, 'null' ]
          additionalProperties:
            type: string
          description: Metadata key-value pairs to add or overwrite
        metadataToRemove:
          type: [ array, 'null' ]
          items:
            type: string
          description: Metadata keys to remove

    RoomSnapshot:
      type: object
      properties:
        code:
          type: string
          description: The 8-character room code
        kind:
          type: integer
          description: |
            Room kind: 0 = EphemeralHostOwned, 1 = PersistentReserved
        isPublic:
          type: boolean
          description: Whether the room is publicly discoverable
        displayName:
          type: string
          description: Display name of the room
        maximumClients:
          type: integer
          description: Maximum number of clients allowed
        connectedClientCount:
          type: integer
          description: Number of currently connected clients
        hasHost:
          type: boolean
          description: Whether the room currently has an active host
        hasPendingHostClaim:
          type: boolean
          description: Whether there is a pending host promotion claim
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Room metadata
      required:
        - code
        - kind
        - isPublic
        - displayName
        - maximumClients
        - connectedClientCount
        - hasHost
        - hasPendingHostClaim
        - metadata

    ClientSnapshot:
      type: object
      description: A client in a room, returned when `--client-details` is `Ids`
      properties:
        virtualClientId:
          type: integer
          description: The virtual client ID the relay assigned when the client joined
      required:
        - virtualClientId
      additionalProperties: false

    ClientIpAddressSnapshot:
      type: object
      description: A client in a room, returned when `--client-details` is `IpAddresses`
      properties:
        virtualClientId:
          type: integer
          description: The virtual client ID the relay assigned when the client joined
        ipAddress:
          type: string
          description: The client's IP address
      required:
        - virtualClientId
        - ipAddress
      additionalProperties: false

    ClientIpEndpointSnapshot:
      type: object
      description: A client in a room, returned when `--client-details` is `IpEndpoints`
      properties:
        virtualClientId:
          type: integer
          description: The virtual client ID the relay assigned when the client joined
        ipAddress:
          type: string
          description: The client's IP address
        port:
          type: integer
          description: The client's UDP port
      required:
        - virtualClientId
        - ipAddress
        - port
      additionalProperties: false

security:
  - bearerAuth: [ ]
