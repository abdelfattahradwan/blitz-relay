name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-relay:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            flavour: slim
          - rid: win-x64
            os: windows-latest
            flavour: standalone
          - rid: win-x64
            os: windows-latest
            flavour: native
          - rid: linux-x64
            os: ubuntu-latest
            flavour: slim
          - rid: linux-x64
            os: ubuntu-latest
            flavour: standalone
          - rid: linux-x64
            os: ubuntu-latest
            flavour: native
          - rid: osx-arm64
            os: macos-latest
            flavour: slim
          - rid: osx-arm64
            os: macos-latest
            flavour: standalone
          - rid: osx-arm64
            os: macos-latest
            flavour: native

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Publish BlitzRelay
        run: dotnet publish src/BlitzRelay/BlitzRelay.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -p:Flavour=${{ matrix.flavour }}

      - name: Upload BlitzRelay (${{ matrix.rid }}-${{ matrix.flavour }})
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BlitzRelay-${{ matrix.rid }}-${{ matrix.flavour }}
          path: src/BlitzRelay/bin/Release/net10.0/${{ matrix.rid }}/publish/

  build-protocol:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.x'

      - name: Build BlitzRelay.Protocol
        run: dotnet build src/BlitzRelay.Protocol/BlitzRelay.Protocol.csproj -c Release

      - name: Upload BlitzRelay.Protocol
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BlitzRelay.Protocol
          path: src/BlitzRelay.Protocol/bin/Release/netstandard2.1/

  release:
    needs: [ build-relay, build-protocol ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DIST_DIR: dist

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p "$DIST_DIR"
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              *win-*)
                (cd "$dir" && zip -r "../../$DIST_DIR/${name}.zip" .)
                ;;
              *)
                tar -czf "../$DIST_DIR/${name}.tar.gz" -C "$dir" .
                ;;
            esac
          done

      - name: Generate checksums
        run: cd "$DIST_DIR" && sha256sum ./* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DIST_DIR"/* --clobber
          else
            gh release create "$tag" "$DIST_DIR"/* --verify-tag --generate-notes --title "$tag"
          fi
